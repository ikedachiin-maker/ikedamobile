<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ikedamobile | お申し込みフォーム</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
      background: #f5f7fa;
      color: #1a1a2e;
      line-height: 1.7;
    }
    header {
      background: linear-gradient(135deg, #0f3460 0%, #1a6985 100%);
      color: #fff;
      text-align: center;
      padding: 36px 20px 28px;
    }
    header .logo { font-size: 1.6rem; font-weight: 800; letter-spacing: 0.05em; margin-bottom: 4px; }
    header .logo span { color: #4fc3f7; }
    header p { font-size: 0.9rem; opacity: 0.85; }

    main { max-width: 560px; margin: 0 auto; padding: 28px 16px 64px; }

    .form-card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.07);
      padding: 28px 24px;
      margin-bottom: 20px;
    }
    .form-card h2 { font-size: 1rem; font-weight: 700; color: #0f3460; margin-bottom: 18px; }

    .field { margin-bottom: 16px; }
    .field label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      color: #555;
      margin-bottom: 4px;
    }
    .field label .req {
      color: #e53935;
      font-size: 0.7rem;
      margin-left: 4px;
    }
    .field input, .field select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 0.95rem;
      color: #1a1a2e;
      background: #fafafa;
      transition: border-color 0.2s;
    }
    .field input:focus, .field select:focus {
      outline: none;
      border-color: #1a6985;
      background: #fff;
    }
    .field-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .file-area {
      border: 2px dashed #ccc;
      border-radius: 8px;
      padding: 20px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s;
      position: relative;
    }
    .file-area:hover { border-color: #1a6985; }
    .file-area input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
    }
    .file-area .file-label { font-size: 0.85rem; color: #888; }
    .file-area .file-name { font-size: 0.85rem; color: #0f3460; font-weight: 600; margin-top: 4px; }

    #card-element {
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: #fafafa;
    }

    .submit-btn {
      display: block;
      width: 100%;
      padding: 16px;
      background: #0f3460;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.2s;
    }
    .submit-btn:hover { background: #1a6985; }
    .submit-btn:disabled { background: #aaa; cursor: not-allowed; }

    .amount-display {
      text-align: center;
      font-size: 1.3rem;
      font-weight: 800;
      color: #0f3460;
      margin: 12px 0;
    }

    .error-msg {
      color: #e53935;
      font-size: 0.82rem;
      margin-top: 8px;
      display: none;
    }

    .success-screen {
      display: none;
      text-align: center;
      padding: 40px 20px;
    }
    .success-screen h2 { font-size: 1.3rem; color: #2e7d32; margin-bottom: 12px; }
    .success-screen p { font-size: 0.95rem; color: #555; }

    footer { text-align: center; font-size: 0.78rem; color: #aaa; padding: 24px; border-top: 1px solid #eee; }
  </style>
</head>
<body>

<header>
  <div class="logo">ikeda<span>mobile</span></div>
  <p>SIMカード お申し込みフォーム</p>
</header>

<main>
  <!-- 申し込みフォーム -->
  <form id="apply-form">

    <!-- 個人情報 -->
    <div class="form-card">
      <h2>お客様情報</h2>

      <div class="field-row">
        <div class="field">
          <label>姓（漢字）<span class="req">必須</span></label>
          <input type="text" id="last_kanji" required placeholder="池田" />
        </div>
        <div class="field">
          <label>名（漢字）<span class="req">必須</span></label>
          <input type="text" id="first_kanji" required placeholder="太郎" />
        </div>
      </div>

      <div class="field-row">
        <div class="field">
          <label>姓（フリガナ）<span class="req">必須</span></label>
          <input type="text" id="last_kana" required placeholder="イケダ" />
        </div>
        <div class="field">
          <label>名（フリガナ）<span class="req">必須</span></label>
          <input type="text" id="first_kana" required placeholder="タロウ" />
        </div>
      </div>

      <div class="field">
        <label>生年月日<span class="req">必須</span></label>
        <input type="date" id="birthday" required />
      </div>

      <div class="field">
        <label>性別<span class="req">必須</span></label>
        <select id="sex" required>
          <option value="">選択してください</option>
          <option value="male">男性</option>
          <option value="female">女性</option>
        </select>
      </div>

      <div class="field">
        <label>メールアドレス<span class="req">必須</span></label>
        <input type="email" id="email" required placeholder="example@email.com" />
      </div>
    </div>

    <!-- プラン選択 -->
    <div class="form-card">
      <h2>プラン選択</h2>

      <div class="field">
        <label>プラン<span class="req">必須</span></label>
        <select id="plan" required>
          <option value="consul">コンサル生 - ¥3,000/回線</option>
          <option value="online">オンラインコース生 - ¥3,300/回線</option>
          <option value="general">一般 - ¥3,600/回線</option>
        </select>
      </div>

      <div class="field">
        <label>申込回線数<span class="req">必須</span></label>
        <select id="lines">
          <option value="1">1回線</option>
          <option value="2">2回線</option>
          <option value="3">3回線</option>
          <option value="4">4回線</option>
          <option value="5">5回線</option>
        </select>
      </div>

      <div class="amount-display" id="amount-display">お支払い金額: ¥3,000</div>
    </div>

    <!-- 本人確認書類 -->
    <div class="form-card">
      <h2>本人確認書類</h2>
      <p style="font-size:0.82rem; color:#888; margin-bottom:12px;">
        運転免許証・パスポート等の画像をアップロードしてください（JPG・PNG・HEIC・PDF、10MB以内）
      </p>
      <div class="file-area" id="file-area">
        <input type="file" id="document" accept=".jpg,.jpeg,.png,.pdf,.heic,.heif" />
        <div class="file-label">タップしてファイルを選択</div>
        <div class="file-name" id="file-name"></div>
      </div>
      <input type="hidden" id="document_id" />
    </div>

    <!-- カード決済 -->
    <div class="form-card">
      <h2>お支払い情報</h2>
      <div class="field">
        <label>クレジットカード番号</label>
        <div id="card-element"></div>
      </div>
      <p class="error-msg" id="error-msg"></p>
      <button type="submit" class="submit-btn" id="submit-btn">お申し込みを確定する</button>
    </div>

  </form>

  <!-- 完了画面 -->
  <div class="success-screen" id="success-screen">
    <div class="form-card">
      <h2 style="color:#2e7d32; text-align:center; font-size:1.2rem;">お申し込みが完了しました</h2>
      <p style="text-align:center; color:#555; margin-top:12px;">
        ご登録いただいたメールアドレスに<br>SIM情報をお送りします。<br><br>
        しばらくお待ちください。
      </p>
    </div>
  </div>
</main>

<footer>&copy; 2025 ikedamobile. All rights reserved.</footer>

<script src="https://js.stripe.com/v3/"></script>
<script>
  const PRICES = { consul: 3000, online: 3300, general: 3600 };
  let stripe, cardElement, documentId = "";

  // 金額表示の更新
  function updateAmount() {
    const plan  = document.getElementById("plan").value;
    const lines = parseInt(document.getElementById("lines").value);
    const total = PRICES[plan] * lines;
    document.getElementById("amount-display").textContent = `お支払い金額: ¥${total.toLocaleString()}`;
  }
  document.getElementById("plan").addEventListener("change", updateAmount);
  document.getElementById("lines").addEventListener("change", updateAmount);

  // Stripe初期化
  fetch("/api/stripe-config")
    .then(r => r.json())
    .then(config => {
      stripe = Stripe(config.publishable_key);
      const elements = stripe.elements({ locale: "ja" });
      cardElement = elements.create("card", {
        style: { base: { fontSize: "16px", color: "#1a1a2e" } }
      });
      cardElement.mount("#card-element");
    });

  // ファイルアップロード
  document.getElementById("document").addEventListener("change", async function() {
    const file = this.files[0];
    if (!file) return;

    const fileNameEl = document.getElementById("file-name");
    const fileLabelEl = document.querySelector(".file-label");

    // サイズチェック（10MB）
    if (file.size > 10 * 1024 * 1024) {
      showError("ファイルサイズは10MB以内にしてください");
      return;
    }

    fileNameEl.textContent = file.name;
    fileLabelEl.textContent = "アップロード中...";

    const form = new FormData();
    form.append("document", file);

    try {
      const res = await fetch("/api/upload-document", { method: "POST", body: form });
      let data;
      try {
        data = await res.json();
      } catch (parseErr) {
        showError("サーバーからの応答を解析できませんでした（ステータス: " + res.status + "）");
        fileLabelEl.textContent = "タップしてファイルを選択";
        return;
      }

      if (data.document_id) {
        documentId = data.document_id;
        document.getElementById("document_id").value = documentId;
        fileLabelEl.textContent = "✓ アップロード完了";
        fileNameEl.textContent = file.name;
      } else {
        showError(data.error || "アップロードに失敗しました");
        fileLabelEl.textContent = "タップしてファイルを選択";
      }
    } catch (e) {
      showError("アップロードに失敗しました。通信エラーの可能性があります。");
      fileLabelEl.textContent = "タップしてファイルを選択";
    }
  });

  // エラー表示
  function showError(msg) {
    const el = document.getElementById("error-msg");
    el.textContent = msg;
    el.style.display = "block";
  }

  // フォーム送信
  document.getElementById("apply-form").addEventListener("submit", async function(e) {
    e.preventDefault();
    const btn = document.getElementById("submit-btn");
    btn.disabled = true;
    btn.textContent = "処理中...";
    document.getElementById("error-msg").style.display = "none";

    const plan  = document.getElementById("plan").value;
    const lines = parseInt(document.getElementById("lines").value);
    const email = document.getElementById("email").value;

    try {
      // 1. PaymentIntent作成
      const piRes  = await fetch("/api/payment-intent", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ plan, lines, email }),
      });
      const piData = await piRes.json();
      if (piData.error) { showError(piData.error); btn.disabled = false; btn.textContent = "お申し込みを確定する"; return; }

      // 2. カード決済
      const { error, paymentIntent } = await stripe.confirmCardPayment(piData.client_secret, {
        payment_method: { card: cardElement, billing_details: { email } },
      });
      if (error) { showError(error.message); btn.disabled = false; btn.textContent = "お申し込みを確定する"; return; }

      // 3. 申し込み完了
      await fetch("/api/complete", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          payment_intent_id: paymentIntent.id,
          plan,
          lines,
          email,
          last_kanji:  document.getElementById("last_kanji").value,
          first_kanji: document.getElementById("first_kanji").value,
          last_kana:   document.getElementById("last_kana").value,
          first_kana:  document.getElementById("first_kana").value,
          birthday:    document.getElementById("birthday").value,
          sex:         document.getElementById("sex").value,
          document_id: documentId,
        }),
      });

      // 完了画面表示
      document.getElementById("apply-form").style.display = "none";
      document.getElementById("success-screen").style.display = "block";

    } catch (e) {
      showError("エラーが発生しました。もう一度お試しください。");
      btn.disabled = false;
      btn.textContent = "お申し込みを確定する";
    }
  });
</script>

</body>
</html>
